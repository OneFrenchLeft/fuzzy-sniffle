<dialog id="content-delete-dialog" aria-labelledby="content-delete-title" aria-describedby="content-delete-effects content-delete-ankimie">
  <form id="content-delete-form">
    <h3 id="content-delete-title">Supprimer le chapitre</h3>
    <p id="content-delete-effects"></p>
    <div class="field" id="content-delete-destination-field"><label for="content-delete-destination">Conserver les questions dans</label><select id="content-delete-destination"></select><p class="hint" id="content-delete-destination-status" aria-live="polite"></p></div>
    <p id="content-delete-ankimie"></p>
    <p class="hint">Les identifiants des questions, les révisions et les historiques des élèves sont conservés.</p>
    <p class="content-field-error" id="content-delete-error" role="alert"></p>
    <div class="content-toolbar"><button type="submit" class="btn-ghost btn-small content-danger" id="content-delete-confirm">Supprimer le chapitre</button><button type="button" class="btn-ghost btn-small" id="content-delete-cancel">Annuler</button></div>
  </form>
</dialog>
