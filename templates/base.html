<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Forgecard{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css', v=22) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='katex/katex.min.css') }}">
  <script defer src="{{ url_for('static', filename='katex/katex.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='katex/contrib/auto-render.min.js') }}"></script>
  <script>
  window.katexDelimiters = [
    { left: '$$', right: '$$', display: true },
    { left: '\\[', right: '\\]', display: true },
    { left: '$', right: '$', display: false },
    { left: '\\(', right: '\\)', display: false }
  ];
  </script>
  <script src="{{ url_for('static', filename='js/app.js', v=20) }}" defer></script>
</head>
<body data-page="{{ active }}" {% block body_attrs %}{% endblock %}>
<canvas id="confetti-canvas"></canvas>
<header>
<a class="logo" href="/" title="Retour à l'accueil">Forgecards</a>
<button class="hamburger-btn" id="hamburger-btn" onclick="toggleMobileNav()" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="main-nav">
  <span></span><span></span><span></span>
</button>
<nav class="nav" id="main-nav">
<div class="nav-title">Forgecards</div>
<a class="nav-btn {{ 'active' if active == 'tirage' }}" href="/" {{ 'aria-current=page' if active == 'tirage' }}>Simulation de kholle</a>
<a class="nav-btn {{ 'active' if active == 'liste' }}" href="/liste" {{ 'aria-current=page' if active == 'liste' }}>Forgecards</a>
<a class="nav-btn auth-only {{ 'active' if active == 'sr' }}" href="/sr" {{ 'aria-current=page' if active == 'sr' }} hidden>Répétition espacée</a>
<a class="nav-btn auth-only" href="/qcm" hidden>QCM</a>
<div class="nav-separator"></div>
<a class="nav-btn {{ 'active' if active == 'compte' }}" data-view="compte" href="/compte" {{ 'aria-current=page' if active == 'compte' }}>Espace compte</a>
<button class="nav-btn auth-only" onclick="logoutSr()" hidden>Déconnexion</button>
</nav>
<div class="nav-overlay" id="nav-overlay" onclick="closeMobileNav()"></div>
<button class="subject-toggle" id="subject-toggle" onclick="switchSubject()" hidden title="Changer de matiere"></button>
<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Basculer theme clair/sombre"></button>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">Made with ❤️ by Eliot &amp; XiaoXin</footer>
{% block modals %}{% endblock %}
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
