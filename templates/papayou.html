{% extends "base.html" %}
{% block title %}Capsule vidéo{% endblock %}
{% block content %}
  <section class="view active" id="view-capsule">
    <div class="panel">
      <div class="section-title">Capsule vidéo</div>
      <div style="position:relative;background:#000;border-radius:.6rem;overflow:hidden;aspect-ratio:16/9">
        <video id="capsule-video" controls preload="none"
               style="width:100%;height:100%;display:block">
          <source src="{{ url_for('static', filename='videos/capsule.mp4') }}" type="video/mp4">
        </video>
        <button id="capsule-play" type="button" aria-label="Lire la vidéo"
                style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center">
          <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
            <circle cx="48" cy="48" r="46" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-width="3"/>
            <path d="M38 30l28 18-28 18z" fill="#fff"/>
          </svg>
        </button>
      </div>
    </div>
  </section>
{% endblock %}
